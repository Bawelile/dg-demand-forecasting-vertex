# One place for every setting. Change numbers here, not in the code.

project:
  name: dg-demand-forecasting
  # Fill these in when you move to Google Cloud (Lesson 11).
  gcp_project: YOUR_GCP_PROJECT_ID
  region: us-central1
  bucket: gs://YOUR_BUCKET_NAME
  bq_dataset: dg_forecast
  image: us-central1-docker.pkg.dev/YOUR_GCP_PROJECT_ID/ml/dgforecast:latest

data:
  # Local default is small enough for a laptop (about 1.3 million rows).
  # For the "full scale" story use n_stores: 100, n_items: 200 (14.6 million rows).
  n_stores: 30
  n_items: 60
  start_date: "2024-01-01"
  n_days: 730          # two years of history
  future_days: 28      # four weeks we hold back to play the role of "next month"
  seed: 42
  # A change in the world during the future weeks, to test monitoring (Lesson 9).
  drift_scenario:
    enabled: true
    region_hit: South          # a new competitor opens in the South
    region_demand_change: -0.30
    category_price_change:     # suppliers raise household prices 12%
      household: 0.12

forecast:
  horizon_days: 14     # we forecast 14 days ahead
  min_lag_days: 14     # so every sales feature looks back at least 14 days (no leakage)

validation:
  min_rows: 10000
  max_null_rate: 0.01
  max_duplicate_rows: 0

train:
  test_days: 28        # the last 4 weeks are the exam the model never sees
  valid_days: 28       # the 4 weeks before that are used for early stopping
  params:
    objective: "reg:tweedie"       # good for counts with many zeros
    tweedie_variance_power: 1.2
    learning_rate: 0.05
    max_depth: 8
    min_child_weight: 20
    subsample: 0.8
    colsample_bytree: 0.8
    eval_metric: "rmse"
    tree_method: "hist"
  num_boost_round: 1500
  early_stopping_rounds: 50

gate:
  # A new model must beat the live model (champion) by at least 1% WAPE,
  # and must always beat the naive baseline.
  min_relative_improvement: 0.01

economics:
  # Assumptions for turning forecast error into dollars (state these in interviews).
  gross_margin_rate: 0.35   # an under-forecast unit is a lost sale: we lose its margin
  holding_cost_rate: 0.25   # an over-forecast unit sits on the shelf or in the back room

monitoring:
  psi_alert: 0.20            # a feature's distribution moved a lot
  wape_alert_ratio: 1.20     # live error is 20% worse than at training time
  region_bias_alert: 0.20    # any region over- or under-forecast by more than 20%

paths:
  root: artifacts
