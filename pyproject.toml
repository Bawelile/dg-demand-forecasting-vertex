[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dgforecast"
version = "0.1.0"
description = "Store-item demand forecasting with XGBoost on Vertex AI: data to monitoring."
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0", "numpy>=1.26", "pyarrow>=14", "pyyaml>=6",
  "xgboost>=2.0", "scikit-learn>=1.3", "matplotlib>=3.8",
]

[project.optional-dependencies]
cloud = ["google-cloud-aiplatform>=1.60", "google-cloud-bigquery>=3.20", "google-cloud-storage>=2.16", "kfp>=2.7"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dgforecast = ["features/sql/*.sql", "report/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
