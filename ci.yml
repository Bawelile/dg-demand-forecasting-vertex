# Lesson 10 (CI). On every push: install, run the tests, and compile the Vertex pipelines.
name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]" "kfp>=2.7"
      - run: pytest -q
      - run: python -m dgforecast.pipeline.vertex_pipeline
